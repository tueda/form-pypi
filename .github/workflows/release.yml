name: Release

on:
  push:
    paths-ignore: [.pre-commit-config.yaml]
  pull_request:
    paths-ignore: [.pre-commit-config.yaml]
  schedule:
    - cron: 0 0 1 * *  # monthly rebuild to catch environment changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build-wheels:
    name: >-
      Build wheels on ${{ matrix.os }}
      (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: manylinux
            arch: x86_64
          - os: ubuntu-24.04-arm
            platform: manylinux
            arch: aarch64
          - os: macos-15-intel
            platform: macos
            arch: x86_64
          - os: macos-15
            platform: macos
            arch: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: cp310-${{ matrix.platform }}*
          CIBW_TEST_COMMAND: form-bin -vv

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-wheels-${{ matrix.platform }}-${{ matrix.arch }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Build source distribution
        run: pipx run build --sdist

      - name: Upload source distribution
        uses: actions/upload-artifact@v7
        with:
          name: artifacts-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  check-dist:
    name: Check distributions
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: dist

      - name: List distribution contents
        run: |
          for file in dist/*; do
            echo
            echo "$file"
            echo '------------------------------------------------------------------------'
            case "$file" in
              *.tar.gz)
                tar -tf "$file"
                ;;
              *.whl)
                zipinfo -1 "$file"
                ;;
              *)
                echo "error: unknown file type: $file" >&2
                exit 1
                ;;
            esac
          done

      - name: Check distributions
        run: |
          pipx run twine check --strict dist/*
          pipx run check-wheel-contents dist/*.whl

  test-sdist:
    name: Test source distribution
    needs: [build-sdist]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: artifacts-sdist
          path: dist

      - name: Install source distribution
        run: python -m pip install dist/*.tar.gz

      - name: Test installed package
        run: form-bin -vv

  publish:
    name: Upload release to PyPI
    needs: [check-dist, test-sdist]
    if: >-
      github.repository == 'form-dev/form-pypi'
      && github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/form-bin
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: artifacts-*
          merge-multiple: true
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verify-metadata: false  # already verified by twine check --strict
